baseURL = "https://blog.iliathoughts.com/"
# [en, zh-cn, fr, ...] determines default content language
defaultContentLanguage = "en"
# language code
languageCode = "en"
title = "Ilia thoughts"

# Change the default theme to be use when building the site with Hugo
theme = "loveit"


[params]
  # LoveIt theme version
  version = "0.2.X"
  [params.footer]
    enable = false
  [params.home]
    [params.home.profile]
      enable = true
      avatarUrl = "img/ilia.webp"
      title = "Ilia thoughts"
      subtitle = "Thoughts on data analytics, software development, and other things."
      social = true
      typeit = false
    # [params.home.posts]
    #   enable = true
    #   paginate = 1
  [params.social]
    GitHub = "bezdomniy"
    Email = "ilia@iliathoughts.com"
    LinkedIn = "iliachibaev"


[menu]
  [[menu.main]]
    identifier = "posts"
    # you can add extra information before the name (HTML format is supported), such as icons
    pre = ""
    # you can add extra information after the name (HTML format is supported), such as icons
    post = ""
    name = "Posts"
    url = "/posts/"
    # title will be shown when you hover on this menu link
    title = ""
    weight = 1
  [[menu.main]]
    identifier = "tags"
    pre = ""
    post = ""
    name = "Tags"
    url = "/tags/"
    title = ""
    weight = 2
  [[menu.main]]
    identifier = "categories"
    pre = ""
    post = ""
    name = "Categories"
    url = "/categories/"
    title = ""
    weight = 3

# Markup related configuration in Hugo
[markup]
  # Syntax Highlighting (https://gohugo.io/content-management/syntax-highlighting)
  [markup.highlight]
    # false is a necessary configuration (https://github.com/dillonzq/LoveIt/issues/158)
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true